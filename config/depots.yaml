# B2 Cargo — 11 depo. Yeni depo eklemek = buraya bir blok eklemek.
# Hiçbir Python dosyası değişmez (11 ajan = 1 kod kuralı).
#
# Her depo: id, name, city, timezone ve zon (bölge) listesi.
# zone_id'ler StockItem.zone_id ve DepotZoneTemperature.zone_id ile eşleşir.

depots:
  - id: istanbul
    name: İstanbul Ana Depo
    city: İstanbul
    timezone: Europe/Istanbul
    zones:
      - { id: frozen, name: Donuk Bölge }
      - { id: cold, name: Soğuk Bölge }
      - { id: ambient, name: Kuru Bölge }

